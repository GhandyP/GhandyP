name: Validate and deploy portfolio

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    validate:
        name: Validate public site
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate source files
              run: python3 scripts/validate_site.py

            - name: Build clean public artifact
              run: python3 scripts/build-public-artifact.py

            - name: Validate public artifact
              run: python3 scripts/validate_site.py --root _site --artifact

            - name: Check JavaScript syntax
              run: node --check script.js

    deploy:
        name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Build clean public artifact
              run: python3 scripts/build-public-artifact.py

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
